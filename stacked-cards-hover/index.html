<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stacked Cards Hover</title>
  <link rel="stylesheet" href="src/css/styles.css" />
</head>
<body>
<div class="container">
  <div class="stack-container">

    <div class="stack-card card-3">
      <div class="card-badge">Security</div>
      <h3>Vault Protection</h3>
      <p>Automated cloud backups with instant recovery options.</p>
    </div>

    <div class="stack-card card-2">
      <div class="card-badge">Analytics</div>
      <h3>Real-time Metrics</h3>
      <p>Track user behavior and traffic with high precision.</p>
    </div>

    <div class="stack-card card-1">
      <div class="card-badge">Performance</div>
      <h3>Edge Engine</h3>
      <p>Hover over the stack to reveal all active dashboard modules.</p>
    </div>
  </div>
</div>
</body>
</html>
