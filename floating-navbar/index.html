<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra Neon SaaS Navbar</title>
  <link rel="stylesheet" href="src/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  
  <div class="aurora-container">
    <div class="aurora blob-1"></div>
    <div class="aurora blob-2"></div>
    <div class="aurora blob-3"></div>
  </div>

  
  <header class="navbar-container">
    <div class="navbar-gradient-border">
      <nav class="navbar">
        
       
        <a href="#" class="brand">
          <div class="logo-wrapper">
            <span class="status-dot"></span>
            <span class="logo-symbol">⚡</span>
          </div>
          <span class="brand-text">Aura<span class="brand-highlight">.ui</span></span>
        </a>

        <ul class="nav-links">
          <li><a href="#" class="active">Product</a></li>
          <li><a href="#">Solutions</a></li>
          <li><a href="#">Enterprise</a></li>
          <li><a href="#">Pricing</a></li>
        </ul>

       
        <a href="#" class="nav-cta">
          <span>Get Started</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </a>

      </nav>
    </div>
  </header>

</body>
</html>
