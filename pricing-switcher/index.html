<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pro Pricing Card</title>
  <link rel="stylesheet" href="src/css/styles.css" />
</head>
<body>
  <div class="card-glow-wrapper">
    <div class="pricing-card">
      <div class="header">
        <span class="badge">🔥 POPULAR</span>
        <h2>Pro SaaS Plan</h2>
        <p>Unlock ultimate workflow speed</p>
      </div>

      <div class="price-box">
        <span class="currency">$</span>
        <span class="price">29</span>
        <span class="period">/mo</span>
      </div>

      <ul class="features">
        <li><span class="check">✓</span> Unlimited Projects</li>
        <li><span class="check">✓</span> 24/7 Priority Support</li>
        <li><span class="check">✓</span> Advanced AI Analytics</li>
      </ul>

      <button class="shimmer-btn">
        <span>Upgrade Now</span>
      </button>
    </div>
  </div>
</body>
</html>
