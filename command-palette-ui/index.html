<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Command Palette UI</title>
  <link rel="stylesheet" href="src/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="bg-glow"></div>

  <div class="command-palette">
    
    
    <div class="search-bar">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" placeholder="Type a command or search..." readonly value="Create new project">
      <div class="shortcut-badge">
        <kbd>ESC</kbd>
      </div>
    </div>

   
    <div class="command-list">
      
      <div class="list-group">
        <span class="group-title">Suggestions</span>
        
        <a href="#" class="command-item active">
          <div class="item-icon">⚡</div>
          <span class="item-text">Create New Project</span>
          <div class="item-shortcut"><kbd>⌘</kbd><kbd>N</kbd></div>
        </a>

        <a href="#" class="command-item">
          <div class="item-icon">🎨</div>
          <span class="item-text">Change Theme Accent</span>
          <div class="item-shortcut"><kbd>⌘</kbd><kbd>T</kbd></div>
        </a>

        <a href="#" class="command-item">
          <div class="item-icon">🚀</div>
          <span class="item-text">Deploy to Production</span>
          <div class="item-shortcut"><kbd>⌘</kbd><kbd>D</kbd></div>
        </a>
      </div>

      <div class="list-group">
        <span class="group-title">Settings</span>

        <a href="#" class="command-item">
          <div class="item-icon">👤</div>
          <span class="item-text">Manage Team Members</span>
          <div class="item-shortcut"><kbd>⌘</kbd><kbd>M</kbd></div>
        </a>

        <a href="#" class="command-item">
          <div class="item-icon">🔑</div>
          <span class="item-text">API Keys & Tokens</span>
          <div class="item-shortcut"><kbd>⌘</kbd><kbd>K</kbd></div>
        </a>
      </div>

    </div>

    <div class="command-footer">
      <div class="footer-tip">
        <span>Use <kbd>↑</kbd> <kbd>↓</kbd> to navigate</span>
        <span><kbd>↵</kbd> to select</span>
      </div>
      <span class="brand-tag">Pulse UI</span>
    </div>

  </div>

</body>
</html>
